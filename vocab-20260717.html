const STORAGE_KEY = 'ielts_vocab_20260717';
let idx = 0;
let results = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

function saveResults() { localStorage.setItem(STORAGE_KEY, JSON.stringify(results)); }

function renderCard() {
  const c = CARDS[idx];
  document.getElementById('cardArea').innerHTML = `
    <div class="section-label">词 ${idx+1} / ${CARDS.length} &middot; ${c.p}</div>
    <div class="card-wrap" id="card" onclick="flipCard()">
      <div class="card-inner">
        <div class="card-face">
          <div class="card-type">点击翻转查看释义</div>
          <div class="card-word">${c.w}</div>
          <div class="card-pos">${c.p}</div>
          <div class="card-hint">&#128161; 先想想这个词的意思…</div>
        </div>
        <div class="card-face card-back">
          <div class="card-zh">${c.zh}</div>
          <div class="card-cl">搭配: ${c.cl || '—'}</div>
          <div class="card-ex">${c.ex}</div>
        </div>
      </div>
    </div>`;
  updateStats();
}

function flipCard() { document.getElementById('card').classList.toggle('flipped'); }

function markOk() {
  results[idx] = 'ok';
  saveResults();
  nextCard();
}

function markRetry() {
  results[idx] = 'retry';
  saveResults();
  nextCard();
}

function nextCard() {
  if (idx < CARDS.length - 1) { idx++; renderCard(); }
}

function prevCard() {
  if (idx > 0) { idx--; renderCard(); }
}

function updateStats() {
  const seen = Object.keys(results).length;
  const ok = Object.values(results).filter(v => v === 'ok').length;
  const retry = Object.values(results).filter(v => v === 'retry').length;
  document.getElementById('totalSeen').textContent = seen;
  document.getElementById('totalOk').textContent = ok;
  document.getElementById('totalRetry').textContent = retry;
  document.getElementById('progressFill').style.width = (seen / CARDS.length * 100) + '%';
}

renderCard();
</script>
