{"w":"We can afford neither complacency nor despair.","p":"stem","zh":"我们既不能自满，也不能绝望","cl":"We can afford neither complacency nor despair on the environment","ex":"Faced with the scale of the crisis, <strong>we can afford neither complacency nor despair</strong>."},
{"w":"The decisions we make today will echo for generations to come.","p":"stem","zh":"我们今天做出的决定将影响几代人","cl":"The decisions we make today will echo for generations","ex":"<strong>The decisions we make today</strong> on energy, land and consumption <strong>will echo for generations to come</strong>."}
];

const KEY = "ielts_vocab_20260728";
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
let deck = state.deck || shuffle([...Array(CARDS.length).keys()]);
let idx = state.idx || 0;
let know = state.know || 0;
let weak = state.weak || 0;
let marks = state.marks || {};
let flipped = false;
let currentView = 'flash';

function save() {
  localStorage.setItem(KEY, JSON.stringify({deck, idx, know, weak, marks}));
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB'; u.rate = 0.9;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function render() {
  const remaining = deck.slice(idx);
  const left = remaining.length;
  document.getElementById('kn').textContent = know;
  document.getElementById('wk').textContent = weak;
  document.getElementById('lf').textContent = left;
  document.getElementById('pg').style.width = ((CARDS.length - left) / CARDS.length * 100) + '%';

  if (left === 0) {
    document.getElementById('deck').style.display = 'none';
    const done = document.getElementById('done');
    done.classList.add('show');
    document.getElementById('doneSub').textContent = '知道 ' + know + ' · 不熟 ' + weak;
    return;
  }

  const c = CARDS[deck[idx]];
  document.getElementById('w').textContent = c.w;
  document.getElementById('p').textContent = c.p;
  document.getElementById('zh').textContent = c.zh;
  document.getElementById('cl').textContent = c.cl;
  document.getElementById('ex').innerHTML = c.ex;
  document.getElementById('meta').textContent = (idx + 1) + ' / ' + CARDS.length + ' · 今日主题 Environment Day 6 (Cycle 2)';
  document.getElementById('card').classList.remove('flipped');
  flipped = false;
}

function flip() {
  const card = document.getElementById('card');
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
}

function mark(type) {
  if (idx >= deck.length) return;
  const cardIdx = deck[idx];
  marks[cardIdx] = type;
  if (type === 'know') know++;
  else weak++;
  idx++;
  save();
  render();
  if (currentView === 'list') buildList();
}

function setView(v) {
  currentView = v;
  document.getElementById('vtFlash').classList.toggle('active', v === 'flash');
  document.getElementById('vtList').classList.toggle('active', v === 'list');
  document.getElementById('deck').style.display = v === 'flash' ? 'block' : 'none';
  const lv = document.getElementById('listView');
  lv.style.display = v === 'list' ? 'block' : 'none';
  lv.classList.toggle('active', v === 'list');
  if (v === 'list') buildList();
}

function buildList() {
  const body = document.getElementById('listBody');
  body.innerHTML = CARDS.map((c, i) => {
    const m = marks[i] || '';
    return '<div class="list-row"><div class="num">' + (i+1) + '</div>' +
      '<div class="word"><div class="w' + (m === 'know' ? ' knew' : m === 'weak' ? ' weak' : '') + '">' + c.w + '</div>' +
      '<div class="zh">' + c.zh + '</div></div>' +
      '<button class="spk" onclick="speak(\'' + c.w.replace(/'/g, "\\'") + '\')">&#128266;</button>' +
      '<div class="mk' + (m === 'know' ? ' know' : m === 'weak' ? ' weak' : '') + '">' + (m === 'know' ? '&#9989;' : m === 'weak' ? '&#128543;' : '') + '</div></div>';
  }).join('');
}

function resetAll() {
  deck = shuffle([...Array(CARDS.length).keys()]);
  idx = 0; know = 0; weak = 0; marks = {};
  save();
  document.getElementById('done').classList.remove('show');
  document.getElementById('deck').style.display = 'block';
  render();
}

function reviewWeak() {
  const weakCards = Object.entries(marks).filter(([,v]) => v === 'weak').map(([k]) => parseInt(k));
  if (weakCards.length === 0) { alert('没有标记为不熟的词'); return; }
  deck = shuffle(weakCards);
  idx = 0; know = 0; weak = 0; marks = {};
  save();
  document.getElementById('done').classList.remove('show');
  document.getElementById('deck').style.display = 'block';
  render();
}

render();
</script>
