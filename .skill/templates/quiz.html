<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2563eb">
<title>测验 · {{quizTitle}}</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280;
    --accent: #2563eb; --ok: #059669; --err: #dc2626;
    --card: #f9fafb; --border: #e5e7eb;
    --nav-bg: rgba(255,255,255,0.92);
    --header-bg: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --fg: #f1f5f9; --muted: #94a3b8;
      --accent: #60a5fa; --ok: #34d399; --err: #f87171;
      --card: #1e293b; --border: #334155;
      --nav-bg: rgba(15,23,42,0.92);
      --header-bg: linear-gradient(135deg, #1e40af 0%, #6b21a8 100%);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: calc(64px + env(safe-area-inset-bottom, 0));
  }

  /* Shared app header */
  .app-header {
    background: var(--header-bg); color: white;
    padding: calc(env(safe-area-inset-top, 16px) + 12px) 16px 14px;
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
  }
  .back-btn {
    background: rgba(255,255,255,0.18); border: none;
    color: white; width: 34px; height: 34px; border-radius: 10px;
    font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
    text-decoration: none; display: flex; align-items: center; justify-content: center;
  }
  .app-header .ttl {
    font-size: 1rem; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .app-header .sub {
    font-size: 0.72rem; opacity: 0.85;
    margin-top: 1px; letter-spacing: 0.04em; text-transform: uppercase;
  }

  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .progress {
    height: 6px; background: var(--border); border-radius: 3px;
    margin-bottom: 16px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    transition: width 0.3s ease;
  }
  .passage {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 0.95rem; line-height: 1.7;
  }
  .passage h3 { margin: 0 0 8px; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .question {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
  }
  .q-num {
    color: var(--muted); font-size: 0.78rem;
    font-family: "SF Mono", Menlo, monospace; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .q-text { font-size: 1rem; margin-bottom: 12px; font-weight: 500; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    cursor: pointer; font-size: 0.95rem; text-align: left;
    color: var(--fg);
    font-family: inherit;
  }
  .option.selected { border-color: var(--accent); background: rgba(37, 99, 235, 0.08); }
  .option.correct { border-color: var(--ok); background: rgba(5, 150, 105, 0.1); }
  .option.wrong { border-color: var(--err); background: rgba(220, 38, 38, 0.1); }
  .blank-input {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 1rem;
    color: var(--fg); font-family: inherit;
  }
  .blank-input.correct { border-color: var(--ok); }
  .blank-input.wrong { border-color: var(--err); }
  .explanation {
    margin-top: 10px; padding: 10px 12px;
    background: var(--bg); border-left: 3px solid var(--accent);
    border-radius: 4px; font-size: 0.9rem; color: var(--muted);
    display: none;
  }
  .explanation.show { display: block; }
  .explanation .answer { color: var(--ok); font-weight: 600; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 12px;
    border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--card); color: var(--fg); border: 1px solid var(--border); }
  .result {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
    text-align: center; margin-top: 20px; display: none;
  }
  .result.show { display: block; }
  .score { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
  .score-label { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

  /* Tab bar */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding-bottom: env(safe-area-inset-bottom, 0);
    z-index: 30;
  }
  .tab-btn {
    flex: 1; background: transparent; border: none;
    padding: 10px 4px 8px;
    color: var(--muted); font-size: 0.68rem;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-family: inherit; text-decoration: none;
  }
  .tab-btn .icon { font-size: 1.25rem; line-height: 1; }
  .tab-btn.active { color: var(--accent); }
</style>
</head>
<body>

<header class="app-header">
  <a class="back-btn" href="index.html#quizzes">←</a>
  <div style="flex:1;min-width:0;">
    <div class="ttl">{{quizTitle}}</div>
    <div class="sub">{{quizSubtitle}}</div>
  </div>
</header>

<main>

  <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  {{passageBlock}}

  <div id="questions">
    {{questions}}
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="resetQuiz()">重做</button>
    <button class="btn btn-primary" onclick="submitQuiz()">提交对答</button>
  </div>

  <div class="result" id="result">
    <div class="score" id="scoreNum">--</div>
    <div class="score-label">正确率</div>
    <div id="scoreDetail" style="margin-top:10px;color:var(--muted);"></div>
  </div>

</main>

<nav class="tabbar">
  <a class="tab-btn" href="index.html#home"><span class="icon">🏠</span>概览</a>
  <a class="tab-btn" href="index.html#materials"><span class="icon">📺</span>材料</a>
  <a class="tab-btn active" href="index.html#quizzes"><span class="icon">✏️</span>测验</a>
  <a class="tab-btn" href="index.html#plan"><span class="icon">📋</span>计划</a>
</nav>

<script>
  document.querySelectorAll(".option").forEach(opt => {
    opt.addEventListener("click", () => {
      const q = opt.closest(".question");
      q.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
      opt.classList.add("selected");
      q.dataset.userAnswer = opt.dataset.key;
      updateProgress();
    });
  });

  document.querySelectorAll(".blank-input").forEach(inp => {
    inp.addEventListener("input", () => {
      inp.closest(".question").dataset.userAnswer = inp.value.trim();
      updateProgress();
    });
  });

  function updateProgress() {
    const total = document.querySelectorAll(".question").length;
    const done = document.querySelectorAll(".question[data-user-answer]").length;
    document.getElementById("progressFill").style.width = (done/total*100) + "%";
  }

  function submitQuiz() {
    let correct = 0, total = 0;
    document.querySelectorAll(".question").forEach(q => {
      total++;
      const userAns = (q.dataset.userAnswer || "").toLowerCase();
      const correctAns = q.dataset.answer.toLowerCase();
      const isCorrect = userAns === correctAns;
      if (isCorrect) correct++;

      if (q.dataset.type === "mcq") {
        q.querySelectorAll(".option").forEach(o => {
          if (o.dataset.key.toLowerCase() === correctAns) o.classList.add("correct");
          else if (o.dataset.key.toLowerCase() === userAns && !isCorrect) o.classList.add("wrong");
        });
      } else if (q.dataset.type === "blank") {
        const inp = q.querySelector(".blank-input");
        inp.classList.add(isCorrect ? "correct" : "wrong");
      }
      q.querySelector(".explanation")?.classList.add("show");
    });

    const result = document.getElementById("result");
    const pct = Math.round(correct/total*100);
    document.getElementById("scoreNum").textContent = pct + "%";
    document.getElementById("scoreDetail").textContent = `${correct} / ${total} 正确`;
    result.classList.add("show");
    result.scrollIntoView({behavior:"smooth"});
  }

  function resetQuiz() {
    document.querySelectorAll(".question").forEach(q => {
      delete q.dataset.userAnswer;
      q.querySelectorAll(".option").forEach(o => o.classList.remove("selected","correct","wrong"));
      const inp = q.querySelector(".blank-input");
      if (inp) { inp.value = ""; inp.classList.remove("correct","wrong"); }
      q.querySelector(".explanation")?.classList.remove("show");
    });
    document.getElementById("result").classList.remove("show");
    document.getElementById("progressFill").style.width = "0%";
  }
</script>

</body>
</html>
